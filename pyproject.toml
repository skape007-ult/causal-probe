[project]
name = "causal-probe"
version = "1.0.1"
description = "Do small LLMs encode the causal-reasoning answer they get wrong? Probing, steering and patching on Corr2Cause and CLadder, against text-only baselines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs a model download / forward pass"]
